# Config for actions/labeler, which .github/workflows/labeler.yml runs on every pull request.
# Each label is made by hand; the workflow cannot create one.
#
# A plugin's label applies to its source and its tests, in one brace pattern. Every plugin
# has the full pattern, even where a directory does not exist yet.
# tests/repo/labeler.test.ts requires a rule for each directory in plugins/.

"plugin:biome-lsp":
  - changed-files:
      - any-glob-to-any-file: "{plugins,tests/plugins}/biome-lsp/**"

"plugin:lsp-merge":
  - changed-files:
      - any-glob-to-any-file: "{plugins,tests/plugins}/lsp-merge/**"

"plugin:typescript7-lsp":
  - changed-files:
      - any-glob-to-any-file: "{plugins,tests/plugins}/typescript7-lsp/**"
