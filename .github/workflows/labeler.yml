name: Labeler

# `pull_request_target` runs the workflow file from the base branch, with a
# token that can write. So this workflow never checks out or runs the code
# of a pull request. `actions/labeler` reads `.github/labeler.yml` from the
# base branch through the API. Because of this, the pull request that adds
# this workflow does not label itself; the first pull request after the
# merge does.
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Not a required check. It labels a pull request and judges nothing.
  labeler:
    name: labeler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
